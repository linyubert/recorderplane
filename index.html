    margin:0; font-family:var(--font); line-height:1.5; color:#fff;
    image-rendering: pixelated; overflow:hidden;
    height:100vh; width:100vw; background:#0a0f1f;
  }
  /* 遊戲區：填滿整個視窗 */
  #gameArea{ position:absolute; inset:0; }
  canvas{ display:block; width:100%; height:100%; image-rendering: pixelated; }

  /* ── 進入頁面（標題畫面）── */
  #splash{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    /* 以 hero-mobile.png 為底圖，鋪滿整個進入頁面 */
    background:#0a0f1f var(--hero) center center / cover no-repeat;
    image-rendering:pixelated;
    transition:opacity .4s ease;
  }
  #splash.hide{ opacity:0; pointer-events:none; }
  .splash-inner{
    /* 按鈕區疊在底圖上方、靠下方擺放（標題在圖上半部） */
    position:absolute; left:0; right:0; bottom:8vh;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .splash-start{
    width:auto; min-width:min(60vw,360px);
    padding:22px 46px; font-family:var(--font); font-size:1.6rem; letter-spacing:3px;
    color:#fff; cursor:pointer; background:#3c8527;
    border:6px solid #000;
    box-shadow: inset -5px -5px 0 #235016, inset 5px 5px 0 #66c948, 0 8px 0 #173a0e;
    text-shadow:3px 3px 0 rgba(0,0,0,.5);
    animation: pulse 1.1s ease-in-out infinite;
  }
  .splash-start:hover{ background:#4aa330; }
  .splash-start:active{ transform:translateY(4px); box-shadow: inset 5px 5px 0 #235016, inset -5px -5px 0 #66c948, 0 4px 0 #173a0e; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.05); } }
  .splash-tip{ margin-top:14px; font-size:.7rem; color:#fff; text-shadow:2px 2px 0 rgba(0,0,0,.7), 0 0 8px rgba(0,0,0,.5); }
  @media (max-width:640px){
    .splash-start{ font-size:1.1rem; padding:18px 30px; }
  }

  /* ── 結束 / 通關畫面（共用主視覺底圖）── */
  #endscreen{
    position:fixed; inset:0; z-index:110;
    display:flex; align-items:center; justify-content:center;
    background:#0a0f1f var(--hero) center center / cover no-repeat;
    image-rendering:pixelated;
    transition:opacity .35s ease;
  }
  #endscreen.hidden{ opacity:0; pointer-events:none; }
  .end-panel{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:34px 40px; text-align:center;
    background:rgba(10,15,31,.78);
    border:6px solid #000;
    box-shadow: inset -5px -5px 0 rgba(0,0,0,.5), inset 5px 5px 0 rgba(255,255,255,.12), 0 12px 40px rgba(0,0,0,.6);
  }
  .end-title{
    font-family:var(--font); font-size:2rem; letter-spacing:3px; color:#ffe34d;
    text-shadow:4px 4px 0 rgba(0,0,0,.7);
  }
  #endscreen.win .end-title{ color:#7CFF4F; }
  .end-score{ font-family:var(--font); font-size:.9rem; color:#fff; text-shadow:2px 2px 0 rgba(0,0,0,.6); }
  .end-panel .splash-start{ margin-top:6px; }
  @media (max-width:640px){
    .end-title{ font-size:1.3rem; }
    .end-score{ font-size:.65rem; }
    .end-panel{ padding:24px 22px; }
  }

  /* 抽屜開關按鈕（固定在右上角） */
  #drawerToggle{
    position:fixed; top:14px; right:14px; z-index:30; width:auto;
    padding:10px 14px; margin:0; font-family:var(--font); font-size:.6rem; color:#fff;
    cursor:pointer; letter-spacing:1px; background:var(--stone);
    border:4px solid #000; box-shadow: inset -4px -4px 0 var(--stone-d), inset 4px 4px 0 var(--stone-l);
    text-shadow:2px 2px 0 rgba(0,0,0,.5);
  }
  #drawerToggle:hover{ background:#7d9c6e; }
  /* 半透明遮罩（抽屜開啟時） */
  #scrim{
    position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.35);
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  body.drawer-open #scrim{ opacity:1; pointer-events:auto; }

  /* 右側彈出抽屜面板 */
  #panel{
    position:fixed; top:0; right:0; z-index:25;
    width:clamp(300px, 32vw, 440px); height:100vh; overflow-y:auto;
    transform:translateX(100%); transition:transform .28s cubic-bezier(.4,0,.2,1);
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 4px, transparent 4px 8px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 4px, transparent 4px 8px),
      var(--stone);
    border-left:6px solid #000;
    box-shadow: inset 6px 0 0 var(--stone-l), -8px 0 24px rgba(0,0,0,.5);
    padding:16px 16px 40px; text-shadow:2px 2px 0 rgba(0,0,0,.45);
  }
  body.drawer-open #panel{ transform:translateX(0); }

  /* ── 抽屜頂端：主視覺 + 關閉鈕 ── */
  #closeDrawer{ width:100%; margin:0 0 12px; }
  .hero{
    width:100%; display:block; border:4px solid #000; margin-bottom:6px;
    box-shadow: inset -3px -3px 0 rgba(0,0,0,.3), inset 3px 3px 0 rgba(255,255,255,.25);
    image-rendering:pixelated;
  }
  .tagline{
    font-size:.6rem; color:#fffbd0; text-align:center; line-height:1.9;
    margin:0 0 4px; padding:8px 6px; background:rgba(0,0,0,.22); border:3px solid #000;
  }
  .tagline b{ color:#ffe34d; }

  /* ── 區塊容器：每個功能一張卡片 ── */
  .section{
    margin:16px 0 0; padding:14px 14px 16px;
    background:rgba(0,0,0,.16); border:3px solid #000;
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.08);
  }
  .section + .section{ margin-top:14px; }
  .sec-title{
    font-size:.62rem; color:#ffe34d; margin:0 0 12px; padding-bottom:8px;
    border-bottom:3px solid rgba(255,255,255,.18); letter-spacing:1px;
    display:flex; align-items:center; gap:8px;
  }

  /* ── 目前音高顯示 ── */
  .note-now{
    font-size:2.1rem; text-align:center; margin:0 0 8px; color:#3a3a3a; min-height:1.3em;
    background:#c9c9c9; border:4px solid #000;
    box-shadow: inset -3px -3px 0 #8b8b8b, inset 3px 3px 0 #efefef; padding:14px 0;
  }
  .freq{ text-align:center; color:#cfe6ff; font-size:.6rem; margin:0 0 12px; }
  .meter-label{ font-size:.55rem; color:#cdd6e6; margin:0 0 6px; }
  .meter{ height:18px; background:#2a2a2a; overflow:hidden; border:3px solid #000;
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.15); }
  .meter > i{ display:block; height:100%; width:0%;
    background: repeating-linear-gradient(90deg,#7CFF4F 0 8px, #5fd636 8px 16px); }

  /* ── 分數列：兩格並排 ── */
  .stat-grid{ display:flex; gap:10px; }
  .stat-box{ flex:1; text-align:center; padding:10px 6px; background:rgba(0,0,0,.25); border:3px solid #000;
    box-shadow: inset -2px -2px 0 rgba(0,0,0,.3), inset 2px 2px 0 rgba(255,255,255,.12); }
  .stat-box .lab{ font-size:.5rem; color:#cdd6e6; display:block; margin-bottom:8px; }
  .stat-box .val{ font-size:.95rem; color:#ffe34d; }

  /* ── 按鈕 ── */
  button{
    width:100%; padding:14px 8px; font-family:var(--font);
    font-size:.72rem; color:#fff; cursor:pointer; letter-spacing:1px; background:var(--stone);
    border:4px solid #000; box-shadow: inset -4px -4px 0 var(--stone-d), inset 4px 4px 0 var(--stone-l);
    text-shadow:2px 2px 0 rgba(0,0,0,.5);
  }
  button + button{ margin-top:10px; }
  button:hover{ background:#7d9c6e; box-shadow: inset -4px -4px 0 #4c6b3d, inset 4px 4px 0 #a9c79a; }
  button:active{ box-shadow: inset 4px 4px 0 var(--stone-d), inset -4px -4px 0 var(--stone-l); }
  button:disabled{ background:#6a6a6a; color:#cfcfcf; box-shadow: inset -4px -4px 0 #4a4a4a, inset 4px 4px 0 #7e7e7e; cursor:default; }
  button.start{ background:#3c8527; }
  button.start:hover{ background:#4aa330; box-shadow: inset -4px -4px 0 #235016, inset 4px 4px 0 #66c948; }
  button.small{ font-size:.55rem; padding:10px; margin-top:12px; }

  /* ── 音高對照表 ── */
  .map .row{ display:flex; align-items:center; gap:10px; margin:0 0 9px; }
  .map .row:last-child{ margin-bottom:0; }
  .map .k{
    flex:0 0 auto; min-width:3.4em; text-align:center; padding:9px 5px; color:#000; font-size:.7rem;
    border:3px solid #000; box-shadow: inset -3px -3px 0 rgba(0,0,0,.3), inset 3px 3px 0 rgba(255,255,255,.4);
  }
  .map .key2{
    flex:0 0 auto; width:2.1em; text-align:center; padding:8px 0; color:#fff; font-size:.62rem;
    background:var(--stone); border:3px solid #000;
    box-shadow: inset -3px -3px 0 var(--stone-d), inset 3px 3px 0 var(--stone-l);
  }
  .map .lbl{ color:#fff; font-size:.62rem; }

  /* ── 滑桿 ── */
  label.rng{ display:block; font-size:.62rem; color:#fff; }
  label.rng + label.rng{ margin-top:16px; }
  label.rng span{ display:block; margin-bottom:9px; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:16px; background:#2a2a2a; border:3px solid #000; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:24px; background:var(--green);
    border:3px solid #000; cursor:pointer; box-shadow: inset -2px -2px 0 #2e6b1c, inset 2px 2px 0 #8cf06a; }
  input[type=range]::-moz-range-thumb{ width:18px; height:24px; background:var(--green); border:3px solid #000; cursor:pointer; }

  /* ── 英雄榜 ── */
  .board ol{ list-style:none; margin:0; padding:0; }
  .board li{ display:flex; justify-content:space-between; align-items:center;
    font-size:.64rem; padding:9px 8px; margin-bottom:6px; color:#fff;
    background:rgba(0,0,0,.25); border:2px solid #000; }
  .board li:last-child{ margin-bottom:0; }
  .board li.top1{ background:rgba(255,215,0,.18); } 
  .board li.top2{ background:rgba(192,192,192,.16); }
  .board li.top3{ background:rgba(205,127,50,.16); }
  .board li .rk{ color:#9be88a; margin-right:8px; flex:0 0 auto; }
  .board li.top1 .rk{ color:#ffd700; } .board li.top2 .rk{ color:#e0e0e0; } .board li.top3 .rk{ color:#e0975a; }
  .board li .nm{ flex:1; margin:0 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .board li .sc{ color:#7CFF4F; flex:0 0 auto; }
  .board .empty{ font-size:.56rem; color:#bbb; text-align:center; padding:12px 6px; line-height:1.8; }
</style>

<body>
  <!-- 音效檔（請把 lose.mp3 / win.mp3 放在與本 HTML 同一資料夾） -->
  <audio id="sndLose" src="lose.mp3" preload="auto"></audio>
  <audio id="sndWin" src="win.mp3" preload="auto"></audio>

  <!-- 進入頁面（標題畫面）：以 hero-mobile.png 為底圖 -->
  <div id="splash">
    <div class="splash-inner">
      <button id="enterBtn" class="splash-start">▶ START</button>
      <div class="splash-tip">按下 START 進入遊戲</div>
    </div>
  </div>

  <!-- 結束 / 通關畫面（共用主視覺底圖） -->
  <div id="endscreen" class="hidden">
    <div class="end-panel">
      <div class="end-title" id="endTitle">GAME OVER</div>
      <div class="end-score" id="endScore">分數 0 / 30</div>
      <button id="retryBtn" class="splash-start">▶ 再玩一次</button>
      <div class="splash-tip">或吹 高音 Re 重新開始</div>
    </div>
  </div>

  <div id="gameArea"><canvas id="game"></canvas></div>

  <button id="drawerToggle">⚙ 設定</button>
  <div id="scrim"></div>

  <div id="panel">
    <button id="closeDrawer" class="start">✕ 收起設定</button>

    <div class="tagline">飛機飛在五線譜上，吹音控制高度穿過缺口。<br><b>共 3 關 30 題</b>，吹 <b>高音 Re</b> 起飛！</div>

    <!-- 現在音高 -->
    <div class="section">
      <div class="sec-title">🎤 目前音高</div>
      <div class="note-now" id="noteNow">—</div>
      <div class="freq" id="freqText">尚未啟動麥克風</div>

      <div class="meter"><i id="vol"></i></div>
    </div>

    <!-- 分數 -->
    <div class="section">
      <div class="sec-title">📊 成績</div>
      <div class="stat-grid">
        <div class="stat-box"><span class="lab">分數</span><span class="val" id="score">0 / 30</span></div>
        <div class="stat-box"><span class="lab">最高分</span><span class="val" id="best">0</span></div>
      </div>

    <!-- 開始控制 -->
    <div class="section">
      <div class="sec-title">🎮 開始遊戲</div>
      <button id="micBtn">🎤 開啟麥克風</button>
      <button id="startBtn" class="start">▶ 開始 / 重來</button>
    </div>

    <!-- 音高對照 -->
    <div class="section map">
      <div class="sec-title">🎼 音高 → 高度對照</div>
      <div class="row"><span class="k" style="background:#b18cff">Do</span><span class="key2">V</span><span class="lbl">第3間（最高）</span></div>
      <div class="row"><span class="k" style="background:#ff8fab">Si</span><span class="key2">C</span><span class="lbl">第3線</span></div>
      <div class="row"><span class="k" style="background:#37d0bf">La</span><span class="key2">X</span><span class="lbl">第2間</span></div>
      <div class="row"><span class="k" style="background:#ffd166">Sol</span><span class="key2">Z</span><span class="lbl">第2線（最低）</span></div>
      <div class="row"><span class="k" style="background:#9be88a">Re</span><span class="key2">B</span><span class="lbl">🚀 開始 / 重來</span></div>
    </div>

    <!-- 調整 -->
    <div class="section">

        <input type="range" id="sens" min="0.003" max="0.05" step="0.001" value="0.012">
      </label>
      <label class="rng"><span>飛行速度</span>
        <input type="range" id="spd" min="2" max="6" step="0.5" value="3">
      </label>
    </div>

    <!-- 英雄榜 -->
    <div class="section board">
      <div class="sec-title">🏆 英雄榜 Top 5</div>
      <ol id="boardList"></ol>
      <button id="clearBoard" class="small">🗑 清除紀錄</button>
    </div>

  </div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const gameArea=document.getElementById('gameArea');
let best=+(localStorage.getItem('flyBestMC')||0);
document.getElementById('best').textContent=best;

// ===== 英雄榜 =====
function getBoard(){ try{ return JSON.parse(localStorage.getItem('flyBoardMC')||'[]'); }catch(e){ return []; } }
function saveBoard(b){ localStorage.setItem('flyBoardMC', JSON.stringify(b)); }
function renderBoard(){
  const b=getBoard().sort((a,z)=>z.score-a.score || a.t-z.t).slice(0,5);
  const ol=document.getElementById('boardList');
  if(!b.length){ ol.innerHTML='<div class="empty">還沒有紀錄，快來挑戰！</div>'; return; }
  ol.innerHTML=b.map((e,i)=>{
    const medal=['🥇','🥈','🥉'][i]||(i+1)+'.';
    const cls=i<3?('top'+(i+1)):'';
    return `<li class="${cls}"><span class="rk">${medal}</span><span class="nm">${e.name}</span><span class="sc">${e.score}${e.win?' 🏁':''}</span></li>`;
  }).join('');
}
// 加入新成績(達標才問名字也行；這裡只要有分數就記)
function submitScore(sc, win){
  if(sc<=0) return;
  const b=getBoard();
  const low = b.length<5 ? -1 : Math.min(...b.map(e=>e.score));
  // 只有進得了前5名才提示輸入名字
  if(b.length<5 || sc>low){
    let name=prompt('🏆 上榜了！輸入你的名字（最多8字）：', '玩家');
    if(name===null) name='匿名';
    name=(name.trim()||'匿名').slice(0,8);
    b.push({name, score:sc, win:!!win, t:Date.now()});
    b.sort((a,z)=>z.score-a.score || a.t-z.t);
    saveBoard(b.slice(0,5));
  }
  renderBoard();
}
document.getElementById('clearBoard').onclick=()=>{
  if(confirm('確定要清除英雄榜所有紀錄嗎？')){ localStorage.removeItem('flyBoardMC'); renderBoard(); }
};
renderBoard();

const GOAL=30, STAGE_SIZE=10;   // 每 10 分一關，共 3 關，30 分抵達終點
// 階段(0..2)：1晴天 → 2陰天打雷 → 3黃昏
function currentStage(){ return Math.min((score/STAGE_SIZE)|0, 2); }

// 真實高音譜號(G clef) 向量路徑 — viewBox 0 0 24 24，譜號漩渦"眼睛"位於約 (13,15.5)
const CLEF=new Path2D("M13 11V7.5l2.2-2.21c.8-.79.95-2.05.39-3.03A2.47 2.47 0 0 0 13.45 1c-.21 0-.45.03-.64.09C11.73 1.38 11 2.38 11 3.5v3.24L7.86 9.91a5.95 5.95 0 0 0-1.25 6.43c.77 1.9 2.45 3.21 4.39 3.55v.61c0 .26-.23.5-.5.5H9v2h1.5c1.35 0 2.5-1.11 2.5-2.5V20c2.03 0 4.16-1.92 4.16-4.75c0-2.3-1.92-4.25-4.16-4.25m0-7.5c0-.23.11-.41.32-.47c.22-.06.45.03.56.23a.5.5 0 0 1-.08.61l-.8.86zm-2 8c-.97.64-1.7 1.74-1.96 2.76l1.96.52v3.05a3.86 3.86 0 0 1-2.57-2.26c-.59-1.46-.27-3.12.83-4.24L11 9.5zm2 6.5v-5.06c1.17 0 2.18 1.1 2.18 2.31C15.18 17 13.91 18 13 18");

// ===== 版面 (隨視窗大小重算) =====
let W,H,S,center,STAFF,laneY;
const NOTEORDER=['Sol','La','Si','Do'];
const NOTECOLOR={ Sol:'#ffd166', La:'#37d0bf', Si:'#ff8fab', Do:'#b18cff' };
const plane={ x:0, y:0, w:0, h:0 };

function layout(){
  W=canvas.width=gameArea.clientWidth;
  H=canvas.height=gameArea.clientHeight;
  ctx.imageSmoothingEnabled=false;
  S=H/7;                      // 線距
  center=H/2;                 // 第3線(Si/B)
  // 五線(上到下) F D B G E
  STAFF=[center-2*S, center-S, center, center+S, center+2*S];
  // Sol=G(第2線=center+S), La=第2間, Si=B(第3線=center), Do=第3間
  laneY=[ center+S, center+S/2, center, center-S/2 ];
  plane.w=S*0.55; plane.h=S*0.28; plane.x=W*0.30;
  if(!alive){ plane.y=laneY[targetLane]; }
}
function laneOf(note){ return NOTEORDER.indexOf(note); }

let targetLane=0;
let obstacles=[], finish=null, clouds=[], particles=[];
let score=0, frame=0, alive=false, won=false, spawnIn=40, spawnedCount=0, finishSpawned=false, raf=null;
let lastStage=-1;                 // 用來偵測進入新階段
let lightning=0;                  // 閃電亮度(>0時畫面閃白)、雷聲倒數
let nextBolt=0;                   // 下一次打雷的幀

function initClouds(){ clouds=[]; for(let i=0;i<4;i++) clouds.push({x:Math.random()*W, y:H*0.05+Math.random()*H*0.12, w:S*0.6+Math.random()*S*0.5}); }

function setScore(){ document.getElementById('score').textContent = score+' / '+GOAL; }

function reset(){
  obstacles=[]; finish=null; particles=[]; score=0; frame=0; spawnIn=40; spawnedCount=0;
  finishSpawned=false; won=false;
  lastStage=-1; lightning=0; nextBolt=0; lastGapLane=-1;
  targetLane=0; plane.y=laneY[0];
  alive=true; setStatus('☀️ 第1關 晴天｜起飛！吹音調整高度');
  setScore();
  stopClips();     // 停止失敗/勝利音效
  hideEndScreen(); // 收起結束畫面
  closeDrawer();   // 遊戲進行中縮起設定列
  if(raf) cancelAnimationFrame(raf);
  loop();
}
function setLane(note){ const l=laneOf(note); if(l>=0) targetLane=l; }

function curSpeed(){
  let s=+document.getElementById('spd').value * (S/80);   // 隨螢幕縮放
  s += currentStage()*0.7*(S/80);                         // 每進一階段加速
  return s;
}
const STAGE_INFO=[
  {name:'第1關 晴天',     emoji:'☀️'},
  {name:'第2關 陰天打雷', emoji:'⛈️'},
  {name:'第3關 黃昏',     emoji:'🌇'},
];

let lastGapLane=-1;   // 上一題的音，避免連續出一樣的
function spawn(){
  let gapLane=(Math.random()*4)|0;
  // 規則：不要連續出現一樣的音
  if(gapLane===lastGapLane){ gapLane=(gapLane + 1 + ((Math.random()*3)|0)) % 4; }
  lastGapLane=gapLane;
  const note=NOTEORDER[gapLane];
  const gy=laneY[gapLane];
  const gapHalf=S*0.55;
  obstacles.push({ x:W, w:S*0.5, note, color:NOTECOLOR[note], gapTop:gy-gapHalf, gapBot:gy+gapHalf });
}
function spawnFinish(){ finish={ x:W, w:S*0.4 }; }

function loop(){
  raf=requestAnimationFrame(loop);
  frame++;
  const speed=curSpeed();
  plane.y += (laneY[targetLane]-plane.y)*0.18;

  // 階段切換提示
  const st=currentStage();
  if(st!==lastStage){
    lastStage=st;
    const info=STAGE_INFO[st];
    setStatus(info.emoji+' '+info.name+'｜分數 '+score);
    if(st>0) beep(1200,0.12);
    if(st===1) nextBolt=frame+30;   // 進入陰天，馬上準備打雷
  }
  // 第2關打雷
  if(st===1){
    if(frame>=nextBolt){ lightning=14; beep(70,0.35); nextBolt=frame+120+Math.random()*160; }
  }
  if(lightning>0) lightning--;

  if(!finishSpawned){
    if(spawnedCount<GOAL){
      if(--spawnIn<=0){ spawn(); spawnedCount++; spawnIn=Math.max(60,125-score*1.1); }
    } else if(obstacles.length===0){
      spawnFinish(); finishSpawned=true; setStatus('🏁 終點線出現！');
    }
  }

  for(const o of obstacles) o.x-=speed;
  for(const o of obstacles){
    if(!o.passed && o.x+o.w<plane.x){ o.passed=true; score++; setScore(); beep(900,0.05); }
  }
  obstacles=obstacles.filter(o=>o.x+o.w>-S);
  const cloudSpd = st===1 ? 1.1 : 0.4;
  for(const c of clouds){ c.x-=cloudSpd; if(c.x<-c.w){ c.x=W+20; c.y=H*0.05+Math.random()*H*0.12; } }

  const pl={x:plane.x-plane.w/2+4, y:plane.y-plane.h/2+3, w:plane.w-8, h:plane.h-6};
  for(const o of obstacles){
    if(!(pl.x<o.x+o.w && pl.x+pl.w>o.x)) continue;
    if(pl.y<o.gapTop || pl.y+pl.h>o.gapBot) return gameOver();
  }
  if(finish){ finish.x-=speed; if(finish.x+finish.w<plane.x) return win(); }

  draw();
}

// 產生爆炸碎片
function explode(cx,cy){
  const cols=['#ffd166','#ff8c1a','#e63946','#fff3b0','#b0b0b0','#c1121f'];
  for(let i=0;i<46;i++){
    const a=Math.random()*Math.PI*2, sp=(1+Math.random()*7)*(S/80);
    particles.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 1,
      life:30+Math.random()*30, r:(2+Math.random()*4)*(S/80), c:cols[(Math.random()*cols.length)|0] });
  }
}
function updateParticles(){
  for(const p of particles){ p.vy+=0.18*(S/80); p.x+=p.vx; p.y+=p.vy; p.vx*=0.97; p.life--; }
  particles=particles.filter(p=>p.life>0);
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life/30));
    px(p.x-p.r/2, p.y-p.r/2, p.r, p.r, p.c);
  }
  ctx.globalAlpha=1;
}

function gameOver(){
  alive=false; cancelAnimationFrame(raf);
  beep(170,0.3); beep(90,0.4);
  playClip('sndLose');   // 失敗音效
  explode(plane.x, plane.y);
  if(score>best){ best=score; localStorage.setItem('flyBestMC',best); document.getElementById('best').textContent=best; }
  setStatus('💥 墜機了！吹高音 Re 重新開始');
  explosionAnim();
}
// 爆炸動畫(獨立播放，結束後顯示 Game Over)
function explosionAnim(){
  updateParticles();
  draw('boom');
  if(particles.length>0){ requestAnimationFrame(explosionAnim); }
  else { draw('over'); showEndScreen(false); submitScore(score, false); }
}
// 顯示 結束/通關 畫面（共用主視覺）
function showEndScreen(isWin){
  const es=document.getElementById('endscreen');
  document.getElementById('endTitle').textContent = isWin ? '🏆 任務完成！' : 'GAME OVER';
  document.getElementById('endScore').textContent = '分數 '+score+' / '+GOAL;
  es.classList.toggle('win', isWin);
  es.classList.remove('hidden');
}
function hideEndScreen(){ document.getElementById('endscreen').classList.add('hidden'); }
function win(){
  alive=false; won=true; cancelAnimationFrame(raf);
  playClip('sndWin');   // 成功通關音效
  if(score>best){ best=score; localStorage.setItem('flyBestMC',best); document.getElementById('best').textContent=best; }
  setStatus('🏆 任務完成！抵達終點！吹高音 Re 再玩一次');
  draw('win');
  showEndScreen(true);
  submitScore(score, true);
}

// ---- 繪圖 ----
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w,h); }
function darker(hex){ const n=parseInt(hex.slice(1),16);
  return `rgb(${((n>>16&255)*0.6)|0},${((n>>8&255)*0.6)|0},${((n&255)*0.6)|0})`; }

function drawClef(){
  // 把譜號"眼睛"(13,15.5) 對到 Sol線(center+S)，整體高約 5*S
  const f=5*S/21;
  const tx=2.2*S - 13*f;            // 眼睛 x → 約 2.2S
  const ty=(center+S) - 15.5*f;     // 眼睛 y → Sol線
  ctx.save();
  ctx.translate(tx,ty); ctx.scale(f,f);
  ctx.fillStyle='rgba(35,40,58,.55)';
  ctx.fill(CLEF);
  ctx.restore();
}

function drawStaff(){
  // 五線：透明度調低、變細
  ctx.fillStyle='rgba(40,44,60,.20)';
  for(const y of STAFF) ctx.fillRect(0, y-1, W, 2);
  // 起始小節線(淡)
  ctx.fillStyle='rgba(40,44,60,.18)';
  ctx.fillRect(4.2*S, STAFF[0], 2, STAFF[4]-STAFF[0]);
  drawClef();
}

function drawNoteHeads(){
  // 緊鄰高音譜號右側，標出四個音在五線譜上的位置
  const cx=3.5*S, r=S*0.22;       // 放大音符頭，符合五線譜尺度
  for(let i=0;i<4;i++){
    const y=laneY[i], on=(i===targetLane), col=NOTECOLOR[NOTEORDER[i]];
    // 符頭(橢圓)
    ctx.beginPath(); ctx.ellipse(cx, y, on?r*1.3:r, on?r*0.95:r*0.78, -0.3, 0, Math.PI*2);
    ctx.fillStyle = on?col:col+'88'; ctx.fill();
    ctx.lineWidth= on?3:2; ctx.strokeStyle='#222'; ctx.stroke();
    // 符桿(往上)
    ctx.fillStyle = on?'#222':'#2228';
    ctx.fillRect(cx+r*0.78, y-r*2.6, Math.max(2,S*0.03), r*2.6);
    // 音名標籤
    ctx.fillStyle = on?'#fff':'#ffffffaa'; ctx.textAlign='center';
    ctx.font='bold '+(S*(on?0.2:0.16)|0)+'px "Courier New",monospace';
    ctx.fillText(NOTEORDER[i], cx, y+r*1.9);
  }
}

function drawPlane(){
  // 精緻像素小飛機：以 48x28 的設計網格繪製，整體隨 plane 尺寸縮放
  const GW=48, GH=28;
  const u=plane.w/GW;                       // x 縮放
  const v=(plane.h/0.62)/GH;                // y 縮放(plane.h 約佔機身核心高)
  const ox=plane.x-plane.w/2;
  const oy=plane.y-(GH*v)/2;
  // 隨高度微微傾斜：上升時機頭朝上
  const tilt=Math.max(-0.18,Math.min(0.18,(laneY[targetLane]-plane.y)*0.01));
  ctx.save();
  ctx.translate(plane.x, plane.y); ctx.rotate(tilt); ctx.translate(-plane.x, -plane.y);
  function p(dx,dy,w,h,c){ px(ox+dx*u, oy+dy*v, Math.ceil(w*u), Math.ceil(h*v), c); }

  // 尾翼(垂直)
  p(2,2,7,9,'#c1121f'); p(2,2,7,3,'#e63946');
  // 機身主體(膠囊狀，分層上色做出圓潤感)
  p(8,11,30,8,'#d62828');                   // 機身中段(深紅)
  p(8,9,30,3,'#f25c54');                     // 機身上緣亮面
  p(8,18,30,3,'#9d1212');                    // 機身下緣陰影
  p(36,11,8,7,'#e63946');                    // 機頭
  p(42,12,4,5,'#7a0c0c');                    // 機鼻整流罩
  // 機翼(後掠)
  p(16,18,16,5,'#3a6ea5'); p(16,21,16,2,'#274b73');  // 下翼+陰影
  p(18,5,12,5,'#457b9d'); p(18,5,12,2,'#6fa3c7');    // 上翼+亮面
  // 座艙罩(玻璃反光)
  p(27,9,8,5,'#bff0ff'); p(28,9,4,2,'#ffffff'); p(31,11,3,3,'#7fd0ff');
  // 機身裝飾條紋
  p(12,14,22,1,'#ffd166');
  // 螺旋槳(轉動)
  p(45,12,2,5,'#222');
  if(frame%6<3){ p(46,5,2,18,'#333a'); } else { p(43,13,8,2,'#333a'); }
  ctx.restore();
}

function drawWall(o){
  const x=o.x, w=o.w, dk=darker(o.color);
  if(o.gapTop>0){
    px(x,0,w,o.gapTop,o.color); px(x,o.gapTop-4,w,4,dk); px(x+w-4,0,4,o.gapTop,dk);
    for(let yy=6; yy<o.gapTop-6; yy+=14) px(x+6,yy,w-12,4,'#ffffff33');
  }
  if(o.gapBot<H){
    px(x,o.gapBot,w,H-o.gapBot,o.color); px(x,o.gapBot,w,4,'#ffffff55'); px(x+w-4,o.gapBot,4,H-o.gapBot,dk);
    for(let yy=o.gapBot+8; yy<H-6; yy+=14) px(x+6,yy,w-12,4,dk);
  }
  const cy=(o.gapTop+o.gapBot)/2;
  ctx.textAlign='center'; ctx.font='bold '+(S*0.34|0)+'px "Courier New",monospace';
  ctx.fillStyle='#000'; ctx.fillText(o.note, x+w/2+1, cy+S*0.12);
  ctx.fillStyle=o.color; ctx.fillText(o.note, x+w/2, cy+S*0.11);
}

function drawFinish(){
  const x=finish.x, w=finish.w, sq=Math.max(10,S*0.16);
  for(let yy=0; yy<H; yy+=sq) for(let xx=0; xx<w; xx+=sq){
    const dark=(((yy/sq)|0)+((xx/sq)|0))%2===0;
    px(x+xx, yy, sq, sq, dark?'#111':'#fff');
  }
  ctx.save(); ctx.translate(x+w/2, H/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign='center'; ctx.fillStyle='#e63946'; ctx.font='bold '+(S*0.3|0)+'px "Courier New",monospace';
  ctx.fillText('FINISH', 0, S*0.1); ctx.restore();
}

// 各階段天空配色 [上, 下]
const SKY=[
  ['#79b4ff','#cfe6ff'],   // 1 晴天
  ['#3a4250','#5a6472'],   // 2 陰天(灰暗)
  ['#ff9e5e','#ffd6a0'],   // 3 黃昏
];
function drawWeather(st){
  const [top,bot]=SKY[st];
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,top); g.addColorStop(1,bot);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  if(st===0 || st===3){              // 晴天：太陽
    const sx=W-S*1.1, sy=S*0.5, ss=S*0.6;
    px(sx,sy,ss,ss,'#ffe87a'); px(sx+ss*0.1,sy-ss*0.12,ss*0.8,ss*0.12,'#ffe87a'); px(sx-ss*0.12,sy+ss*0.3,ss*0.12,ss*0.4,'#ffe87a');
    for(const c of clouds){ px(c.x,c.y,c.w,c.w*0.22,'#ffffff'); px(c.x+c.w*0.18,c.y-c.w*0.14,c.w*0.55,c.w*0.16,'#ffffff'); }
  } else if(st===1){                 // 陰天打雷：烏雲
    for(const c of clouds){ px(c.x,c.y,c.w,c.w*0.26,'#454b57'); px(c.x+c.w*0.18,c.y-c.w*0.14,c.w*0.55,c.w*0.18,'#363b45'); px(c.x+c.w*0.1,c.y+c.w*0.18,c.w*0.7,c.w*0.1,'#2b2f38'); }
  } else if(st===2){                 // 黃昏：夕陽 + 染色雲
    const sx=W-S*1.3, sy=H*0.42, ss=S*0.85;
    px(sx,sy,ss,ss,'#ff5e3a'); px(sx+ss*0.12,sy+ss*0.12,ss*0.76,ss*0.76,'#ff7e4f');
    for(const c of clouds){ px(c.x,c.y,c.w,c.w*0.22,'#ffb78a'); px(c.x+c.w*0.18,c.y-c.w*0.14,c.w*0.55,c.w*0.16,'#ffc9a3'); }
  }
}

function draw(state){
  const st=currentStage();
  drawWeather(st);

  // 第2關閃電：先畫一道折線閃電，再覆蓋白光
  if(st===1 && lightning>0){
    if(lightning>8){
      ctx.strokeStyle='#fdf6b0'; ctx.lineWidth=Math.max(2,S*0.05); ctx.beginPath();
      let lx=W*0.45+Math.random()*W*0.2, ly=0; ctx.moveTo(lx,ly);
      while(ly<H*0.7){ ly+=H*0.12; lx+=(Math.random()-0.5)*S*0.9; ctx.lineTo(lx,ly); }
      ctx.stroke();
    }
    ctx.fillStyle='rgba(255,255,255,'+(lightning/14*0.6)+')'; ctx.fillRect(0,0,W,H);
  }

  drawStaff();
  if(finish) drawFinish();
  for(const o of obstacles) drawWall(o);
  drawNoteHeads();
  if(state!=='boom' && state!=='over') drawPlane();   // 爆炸時不畫飛機
  drawParticles();

  // 進度條(分階段標記)
  px(0,H-8,W,8,'#0004'); px(0,H-8, W*Math.min(score/GOAL,1), 8, '#7CFF4F');
  for(let m=1;m<3;m++){ px(W*(m*STAGE_SIZE/GOAL)-1, H-8, 2, 8, '#000'); }

  // 左上角階段標示
  if(alive || state==='boom'){
    ctx.textAlign='left'; ctx.font='bold '+(S*0.22|0)+'px "Courier New",monospace';
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillText(STAGE_INFO[st].emoji+' '+STAGE_INFO[st].name, 14, S*0.4);
    ctx.fillStyle='#fff'; ctx.fillText(STAGE_INFO[st].emoji+' '+STAGE_INFO[st].name, 12, S*0.4-2);
  }

  if(!alive && !state) overlayText('吹高音 Re 開始', null);
  if(state==='over'){ ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,W,H); overlayText('Game Over','分數 '+score+' / '+GOAL); }
  if(state==='win'){ ctx.fillStyle='rgba(0,40,0,.6)'; ctx.fillRect(0,0,W,H); overlayText('🏆 任務完成！','抵達終點 '+GOAL+' 分'); }
}
function overlayText(t1,t2){
  const big=Math.min(W,H)*0.07;
  ctx.textAlign='center'; ctx.fillStyle='#fff';
  ctx.shadowColor='#000'; ctx.shadowOffsetX=3; ctx.shadowOffsetY=3;
  ctx.font='bold '+big+'px "Courier New",monospace'; ctx.fillText(t1, W/2, H/2-(t2?big*0.3:-big*0.2));
  if(t2){ ctx.font='bold '+(big*0.55)+'px "Courier New",monospace'; ctx.fillText(t2, W/2, H/2+big*0.7); }
  ctx.shadowOffsetX=0; ctx.shadowOffsetY=0;
}

// ===== 麥克風 + 音高偵測 =====
const NOTES=[
  {name:'Sol', f:783.99,  act:()=>setLane('Sol')},
  {name:'La',  f:880.00,  act:()=>setLane('La')},
  {name:'Si',  f:987.77,  act:()=>setLane('Si')},
  {name:'Do',  f:1046.50, act:()=>setLane('Do')},
  {name:'Re',  f:1174.66, act:()=>{ if(!alive) reset(); }},
];
let analyser,buf,micOn=false;

document.getElementById('micBtn').onclick=async()=>{
  if(micOn) return;
  try{
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    await audioCtx.resume();
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const src=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser(); analyser.fftSize=2048;
    buf=new Float32Array(analyser.fftSize); src.connect(analyser);
    micOn=true; const b=document.getElementById('micBtn'); b.textContent='🎤 已開啟'; b.disabled=true;
    setStatus('麥克風就緒，吹高音 Re 起飛！'); detectLoop();
  }catch(e){ setStatus('無法存取麥克風：'+e.message); }
};
function autoCorrelate(buf,sr){
  let SIZE=buf.length, rms=0;
  for(let i=0;i<SIZE;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/SIZE);
  if(rms<(+document.getElementById('sens').value)) return {freq:-1,rms};
  let r1=0,r2=SIZE-1,th=0.2;
  for(let i=0;i<SIZE/2;i++){ if(Math.abs(buf[i])<th){ r1=i; break; } }
  for(let i=1;i<SIZE/2;i++){ if(Math.abs(buf[SIZE-i])<th){ r2=SIZE-i; break; } }
  const b2=buf.slice(r1,r2), n=b2.length, c=new Array(n).fill(0);
  for(let i=0;i<n;i++) for(let j=0;j<n-i;j++) c[i]+=b2[j]*b2[j+i];
  let d=0; while(c[d]>c[d+1]) d++;
  let mv=-1,mp=-1; for(let i=d;i<n;i++){ if(c[i]>mv){ mv=c[i]; mp=i; } }
  let T0=mp; const x1=c[T0-1]||0,x2=c[T0],x3=c[T0+1]||0,a=(x1+x3-2*x2)/2,bb=(x3-x1)/2;
  if(a) T0=T0-bb/(2*a);
  if(T0<=0) return {freq:-1,rms};
  return {freq:sr/T0,rms};
}
function freqToNote(freq){
  if(freq<=0) return null;
  let f=freq; while(f<700) f*=2; while(f>1400) f/=2;
  let bn=null,bc=9999;
  for(const n of NOTES){ const c=Math.abs(1200*Math.log2(f/n.f)); if(c<bc){ bc=c; bn=n; } }
  return bc>60?null:bn;
}
let lastNote='', stable=0;
function detectLoop(){
  requestAnimationFrame(detectLoop);
  analyser.getFloatTimeDomainData(buf);
  const {freq,rms}=autoCorrelate(buf,audioCtx.sampleRate);
  document.getElementById('vol').style.width=Math.min(100,rms*1200)+'%';
  const noteEl=document.getElementById('noteNow'), freqEl=document.getElementById('freqText');
  const note=freqToNote(freq);
  if(note){
    noteEl.textContent=note.name; noteEl.style.color='#2e6b1c'; noteEl.style.background='#bdf0a8';
    freqEl.textContent=freq.toFixed(1)+' Hz';
    if(note.name===lastNote){ stable++; } else { stable=1; lastNote=note.name; }
    if(stable>=2) note.act();
  } else {
    noteEl.textContent=freq>0?'·':'—'; noteEl.style.color='#3a3a3a'; noteEl.style.background='#c9c9c9';
    freqEl.textContent=freq>0?freq.toFixed(1)+' Hz':'（無聲音）';
    lastNote=''; stable=0;
  }
}
</script>
</body>
